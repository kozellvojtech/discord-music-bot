# Při každém pushi do main sestaví image bota a Lavalinku (x86 i ARM64) a nahraje je do GitHub registru.
# CasaOS si je pak stáhne a Watchtower je sám aktualizuje.
name: Docker images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - "docker-compose*.yml"
      - ".env.example"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            image: discord-music-bot
            context: .
            file: Dockerfile
          - name: lavalink
            image: discord-music-bot-lavalink
            context: lavalink
            file: lavalink/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Název image (malými písmeny)
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
